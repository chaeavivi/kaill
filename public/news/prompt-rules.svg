<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="프롬프트 작성 4원칙 체크리스트 일러스트">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#0b1420"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="44%" r="46%">
      <stop offset="0" stop-color="#3e9b94" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#3e9b94" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- document card -->
  <rect x="378" y="96" width="444" height="470" rx="22" fill="#0f1f34" stroke="#22354f" stroke-width="2"/>

  <!-- header: chip + rule -->
  <rect x="416" y="140" width="150" height="30" rx="15" fill="#3e9b94" opacity="0.18"/>
  <rect x="432" y="151" width="118" height="9" rx="4.5" fill="#6fd0c6"/>
  <rect x="416" y="196" width="368" height="2" fill="#22354f" opacity="0.7"/>

  <!-- 4 checklist rows -->
  <g>
    <!-- row 1 -->
    <circle cx="436" cy="248" r="17" fill="none" stroke="#6fd0c6" stroke-width="3"/>
    <path d="M428 248 l6 6 l11 -13" fill="none" stroke="#6fd0c6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="470" y="234" width="300" height="12" rx="6" fill="#46586e"/>
    <rect x="470" y="256" width="210" height="10" rx="5" fill="#2b3a4d"/>

    <!-- row 2 -->
    <circle cx="436" cy="322" r="17" fill="none" stroke="#6fd0c6" stroke-width="3"/>
    <path d="M428 322 l6 6 l11 -13" fill="none" stroke="#6fd0c6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="470" y="308" width="270" height="12" rx="6" fill="#46586e"/>
    <rect x="470" y="330" width="240" height="10" rx="5" fill="#2b3a4d"/>

    <!-- row 3 -->
    <circle cx="436" cy="396" r="17" fill="none" stroke="#6fd0c6" stroke-width="3"/>
    <path d="M428 396 l6 6 l11 -13" fill="none" stroke="#6fd0c6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="470" y="382" width="300" height="12" rx="6" fill="#46586e"/>
    <rect x="470" y="404" width="190" height="10" rx="5" fill="#2b3a4d"/>

    <!-- row 4 (active) -->
    <circle cx="436" cy="470" r="17" fill="#3e9b94" opacity="0.22"/>
    <circle cx="436" cy="470" r="17" fill="none" stroke="#6fd0c6" stroke-width="3"/>
    <path d="M428 470 l6 6 l11 -13" fill="none" stroke="#6fd0c6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="470" y="456" width="250" height="12" rx="6" fill="#6fd0c6"/>
    <rect x="470" y="478" width="150" height="10" rx="5" fill="#2b3a4d"/>
  </g>

  <!-- pen accent -->
  <g transform="rotate(38 792 508)">
    <rect x="760" y="500" width="86" height="16" rx="4" fill="#16283f" stroke="#22354f" stroke-width="1.5"/>
    <path d="M846 500 l16 8 l-16 8 z" fill="#6fd0c6"/>
  </g>
</svg>
