<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="컴퓨터 모니터와 책상 위 프롬프트 작성 일러스트">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#0b1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="42%">
      <stop offset="0" stop-color="#3e9b94" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3e9b94" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12263f"/>
      <stop offset="1" stop-color="#0e1c30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- desk -->
  <rect x="0" y="556" width="1200" height="119" fill="#0a1220"/>
  <rect x="0" y="556" width="1200" height="3" fill="#22354f" opacity="0.7"/>

  <!-- monitor stand -->
  <rect x="582" y="452" width="36" height="70" fill="#16283f"/>
  <ellipse cx="600" cy="540" rx="96" ry="16" fill="#0e1a2b"/>
  <ellipse cx="600" cy="536" rx="96" ry="14" fill="#16283f"/>

  <!-- monitor body -->
  <rect x="330" y="120" width="540" height="342" rx="18" fill="#0a1420" stroke="#22354f" stroke-width="2"/>
  <rect x="352" y="142" width="496" height="298" rx="10" fill="url(#screen)"/>

  <!-- window chrome -->
  <circle cx="378" cy="170" r="6" fill="#3e9b94"/>
  <circle cx="398" cy="170" r="6" fill="#5c6b7e"/>
  <circle cx="418" cy="170" r="6" fill="#5c6b7e"/>
  <rect x="352" y="188" width="496" height="2" fill="#22354f" opacity="0.6"/>

  <!-- prompt label chip -->
  <rect x="378" y="210" width="120" height="26" rx="13" fill="#3e9b94" opacity="0.18"/>
  <rect x="392" y="219" width="92" height="8" rx="4" fill="#6fd0c6"/>

  <!-- text lines (a prompt being written) -->
  <g fill="#3c4a5c">
    <rect x="378" y="256" width="420" height="11" rx="5.5"/>
    <rect x="378" y="284" width="360" height="11" rx="5.5"/>
    <rect x="378" y="312" width="404" height="11" rx="5.5"/>
  </g>
  <!-- highlighted (accent) line -->
  <rect x="378" y="340" width="300" height="11" rx="5.5" fill="#6fd0c6"/>
  <!-- cursor -->
  <rect x="686" y="337" width="10" height="17" rx="2" fill="#6fd0c6"/>
  <g fill="#2b3a4d">
    <rect x="378" y="372" width="330" height="11" rx="5.5"/>
    <rect x="378" y="400" width="250" height="11" rx="5.5"/>
  </g>

  <!-- keyboard -->
  <rect x="430" y="500" width="340" height="60" rx="10" fill="#12233a" stroke="#1b2e45" stroke-width="1.5"/>
  <g fill="#1e3350">
    <rect x="446" y="512" width="34" height="14" rx="3"/><rect x="486" y="512" width="34" height="14" rx="3"/>
    <rect x="526" y="512" width="34" height="14" rx="3"/><rect x="566" y="512" width="34" height="14" rx="3"/>
    <rect x="606" y="512" width="34" height="14" rx="3"/><rect x="646" y="512" width="34" height="14" rx="3"/>
    <rect x="686" y="512" width="34" height="14" rx="3"/>
    <rect x="446" y="534" width="54" height="14" rx="3"/><rect x="506" y="534" width="128" height="14" rx="3" fill="#26466b"/>
    <rect x="640" y="534" width="40" height="14" rx="3"/><rect x="686" y="534" width="34" height="14" rx="3"/>
  </g>

  <!-- mug -->
  <rect x="812" y="500" width="58" height="56" rx="10" fill="#16283f"/>
  <path d="M870 512 h16 a14 14 0 0 1 0 28 h-16" fill="none" stroke="#16283f" stroke-width="8"/>
  <g stroke="#6fd0c6" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M828 490 q-6 -10 0 -20"/>
    <path d="M846 490 q-6 -10 0 -20"/>
  </g>

  <!-- small plant -->
  <rect x="300" y="516" width="40" height="40" rx="6" fill="#12233a"/>
  <g stroke="#3e9b94" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M320 516 q-14 -26 -30 -34"/>
    <path d="M320 516 q14 -26 30 -34"/>
    <path d="M320 516 v-40"/>
  </g>
</svg>
